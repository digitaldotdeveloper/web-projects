<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frostea Hero Slider</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Cairo:wght@700;800&family=Inter+Tight:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FROSTEA: full-screen web hero slider for an iced tea + sport drink brand.
   Phase 1: LAYERS + TRANSITIONS only. All art is CSS placeholder,
   so each layer can be swapped for a real PNG later.
   Backgrounds, header and index are full-bleed viewport CSS. The product
   composition lives on #canvas: 1920x1080 on landscape screens and
   1080x1920 on portrait/mobile, scaled to fit.
   Keys: <- -> switch, Space pause, S slow-mo, L layer map, H hide cursor
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07090b;overflow:hidden}
body{font-family:"Inter Tight",system-ui,sans-serif;-webkit-font-smoothing:antialiased}

#stage{
  position:fixed;inset:0;overflow:hidden;background:#101316;user-select:none;touch-action:pan-y;
  --ink:#fff;--rays:rgba(255,255,255,.14);
}
#canvas{position:absolute;left:50%;top:50%;transform-origin:50% 50%}
#shake,#scene{position:absolute;inset:0}
#scene{animation:dolly 9s ease-in-out infinite alternate}
@keyframes dolly{from{transform:scale(1)}to{transform:scale(1.025)}}

/* ---------- background plates ---------- */
#bgs{position:absolute;inset:0}
.bg{position:absolute;inset:0;will-change:clip-path,transform}
#rays{position:absolute;left:-860px;top:-400px;width:2800px;height:2800px;
  background:repeating-conic-gradient(from 0deg,var(--rays) 0 5deg,transparent 5deg 15deg);
  -webkit-mask:radial-gradient(closest-side,#000 10%,transparent 72%);mask:radial-gradient(closest-side,#000 10%,transparent 72%);
  animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}

/* ---------- site header (viewport CSS) ---------- */
.nav{position:absolute;left:0;right:0;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;
  padding:clamp(12px,1.7vw,28px) clamp(16px,3.4vw,64px);color:var(--ink);transition:color .6s}
.nav a{color:inherit;text-decoration:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:clamp(18px,1.5vw,26px);letter-spacing:.08em}
.logo svg{width:clamp(24px,1.9vw,32px);height:clamp(24px,1.9vw,32px)}
.logo svg path{fill:currentColor}
.logo svg .cut{stroke:var(--logoCut,#000);stroke-width:2.6;stroke-linecap:round;fill:none;transition:stroke .6s}
.links{display:flex;gap:clamp(18px,2.3vw,42px)}
.links a{position:relative;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
.links a::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:currentColor;transform:scaleX(0);transform-origin:0 50%;transition:transform .35s}
.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.acts{display:flex;align-items:center;gap:10px}
.ico{all:unset;cursor:pointer;position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;
  border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.ico svg{width:18px;height:18px}
.bag span{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--ctaBg);color:var(--ctaInk);font:800 10px/18px "Inter Tight",sans-serif;text-align:center}
.nav a.order{margin-left:6px;background:var(--ctaBg);color:var(--ctaInk);padding:13px 22px;border-radius:99px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;transition:background .6s,color .6s}
.burger{display:none}
.port .links,.port .nav a.order,.port .ico.search{display:none}
.port .burger{display:grid}

/* ---------- numbered flavour index (replaces dots) ---------- */
.index{position:absolute;z-index:50;display:flex;color:var(--ink);transition:color .6s}
.land .index{right:calc(clamp(18px,3.2vw,60px) + 136px);bottom:clamp(16px,3vw,48px);height:50px;align-items:center;gap:22px}
.port .index{left:50%;bottom:14px;transform:translateX(-50%);gap:12px}
.it{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;opacity:.45;transition:opacity .3s}
.it:hover,.it.on{opacity:1}
.it .no{font-family:Anton,Impact,sans-serif;font-size:24px;letter-spacing:.02em}
.it .nm{font-weight:800;font-size:11px;letter-spacing:.2em;text-transform:uppercase;max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .5s}
.land .it.on .nm,.land .it:hover .nm{max-width:170px}
.bar{display:block;width:22px;height:3px;border-radius:3px;overflow:hidden;background:color-mix(in srgb,var(--ink) 28%,transparent);transition:width .5s}
.it.on .bar{width:64px}
.bar b{display:block;height:100%;background:var(--ink);transform:scaleX(0);transform-origin:0 50%}
.port .it .no{font-size:18px}
.port .it .nm{display:none}
.port .it.on .bar{width:40px}
.arrows{position:absolute;z-index:50;right:clamp(18px,3.2vw,60px);bottom:clamp(16px,3vw,48px);display:flex;gap:10px;color:var(--ink)}
.arrows button{all:unset;cursor:pointer;width:50px;height:50px;display:grid;place-items:center;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 40%,transparent);transition:background .25s,color .25s}
.arrows button:hover{background:var(--ink);color:var(--bg)}
.arrows svg{width:20px;height:20px}
.port .arrows{display:none}

/* ---------- text masks ---------- */
.ln{display:block;overflow:hidden;padding-top:.04em}
.ln>span{display:inline-block;will-change:transform}
.head{position:absolute;left:70px;top:246px;width:760px;z-index:30;color:var(--ink)}
.kicker>span{font-weight:800;font-size:28px;letter-spacing:.26em;display:flex;align-items:center;gap:16px}
.kicker>span::before{content:"";width:46px;height:4px;background:currentColor;border-radius:4px}
.name{margin-top:-6px}
.name>span{font-family:Anton,Impact,sans-serif;font-size:146px;line-height:1;letter-spacing:-.004em}
.name.alt>span{color:var(--nameAlt)}

.count{position:absolute;right:66px;top:250px;display:flex;align-items:flex-start;z-index:30;color:var(--ink)}
.cmask{overflow:hidden;height:176px}
.cnum{display:block;font-family:Anton,Impact,sans-serif;font-size:176px;line-height:1;color:transparent;-webkit-text-stroke:3px var(--ink)}
.ctot{font-weight:800;font-size:32px;margin:18px 0 0 8px;opacity:.8}

/* giant word behind the bottle */
.word-pos{position:absolute;left:0;top:600px;width:1080px;height:600px;display:flex;align-items:center;justify-content:center;z-index:5}
.word{position:relative;font-family:Anton,Impact,sans-serif;line-height:1;white-space:nowrap}
.w-out,.w-fill{display:block;overflow:hidden;padding:.03em .02em 0}
.w-fill{position:absolute;inset:0;clip-path:inset(100% 0 0 0)}
.w-fill .ch{color:var(--word)}
.w-out{position:relative}
.w-out .ch{color:transparent;-webkit-text-stroke:4px var(--wordLine)}
.ch{display:inline-block}

/* ribbons */
.rib-pos{position:absolute;left:-170px;width:1420px;height:94px}
.rib-pos.back{top:1300px;transform:rotate(7deg);z-index:8}
.rib-pos.front{top:1466px;transform:rotate(-4deg);z-index:24}
.rib{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;box-shadow:0 22px 40px rgba(0,0,0,.16);clip-path:inset(0 100% 0 0)}
.back .rib{background:var(--ribbon);color:var(--ribbonInk)}
.front .rib{background:var(--ribbon2);color:var(--ribbon2Ink)}
.track{display:flex;white-space:nowrap;font-family:Anton,Impact,sans-serif;font-size:52px;letter-spacing:.05em;animation:marq 16s linear infinite}
.front .track{animation-direction:reverse;animation-duration:13s}
@keyframes marq{to{transform:translateX(-50%)}}

/* ---------- bottle rig: pos (parallax) > anim (WAAPI) > float (CSS) ---------- */
.b-pos{position:absolute;left:540px;top:600px;width:0;height:0;z-index:15}
.b-anim{position:absolute;left:-170px;top:0;width:340px;height:870px;transform-origin:50% 97%;transform:translateY(-2600px)}
.b-float{width:100%;height:100%;animation:bfloat 4.6s ease-in-out infinite alternate}
@keyframes bfloat{from{transform:translateY(0) rotate(-1.2deg)}to{transform:translateY(-20px) rotate(1.2deg)}}
.bottle{position:relative;width:340px;height:870px;--cap:var(--labelInk);filter:drop-shadow(0 38px 44px rgba(0,0,0,.2))}
.bottle>*{position:absolute}
.capgrad{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 5px,transparent 5px 12px),
  linear-gradient(90deg,color-mix(in srgb,var(--cap) 60%,#000),var(--cap) 30%,color-mix(in srgb,var(--cap) 55%,#fff) 50%,var(--cap) 72%,color-mix(in srgb,var(--cap) 60%,#000))}
.cap{left:95px;top:0;width:150px;height:88px;border-radius:18px 18px 10px 10px;z-index:3}
.ring{left:86px;top:84px;width:168px;height:20px;border-radius:7px;z-index:3}
.nozzle{display:none;left:128px;top:0;width:84px;height:52px;border-radius:30px 30px 6px 6px;z-index:3}
.neck{left:115px;top:100px;width:110px;height:80px;z-index:1;
  background:linear-gradient(90deg,rgba(255,255,255,.4),rgba(255,255,255,.08) 38%,rgba(255,255,255,.34) 66%,rgba(255,255,255,.1));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.body{left:0;top:150px;width:340px;height:720px;overflow:hidden;z-index:2;
  border-radius:120px 120px 58px 58px/170px 170px 50px 50px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.body::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:8;pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.3),transparent 20%,rgba(255,255,255,.3) 32%,transparent 44%,transparent 76%,rgba(0,0,0,.28))}
.liq{position:absolute;left:-35%;width:170%;top:12%;height:130%;transform-origin:50% 2%;
  background:linear-gradient(180deg,var(--liq),var(--liq2) 80%)}
.liq::before{content:"";position:absolute;left:0;right:0;top:-10px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--liq) 55%,#fff);opacity:.85}
.liq i{position:absolute;bottom:25%;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:rise var(--d) linear var(--dl) infinite;opacity:0}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-640px);opacity:0}}
.label{position:absolute;left:0;right:0;top:36%;height:40%;z-index:4;background:var(--label);
  border-top:9px solid var(--labelInk);border-bottom:9px solid var(--labelInk);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--labelInk);text-align:center}
.lb-brand{font-weight:900;font-size:22px;letter-spacing:.34em;margin-left:.34em}
.lb-flav{font-family:Anton,Impact,sans-serif;font-size:var(--lf,92px);line-height:.95;margin:8px 0 6px}
.lb-sub{font-weight:800;font-size:17px;letter-spacing:.3em;margin-left:.3em}
.grip{display:none;left:0;right:0;top:82%;height:13%;z-index:5;background:repeating-linear-gradient(180deg,rgba(0,0,0,.2) 0 6px,rgba(255,255,255,.14) 6px 15px)}
.gloss{z-index:9;left:48px;top:250px;width:24px;height:540px;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.05));filter:blur(1px)}
.gloss.g2{left:262px;top:300px;width:9px;height:420px;opacity:.6}
.drops{inset:150px 0 0 0;z-index:9;pointer-events:none}
.drops i{position:absolute;width:var(--w);height:calc(var(--w)*1.25);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0 16%,rgba(255,255,255,.3) 42%,rgba(255,255,255,.06) 72%);
  box-shadow:0 2px 3px rgba(0,0,0,.14)}
.drops i.t{animation:trickle var(--d) ease-in var(--dl) infinite}
@keyframes trickle{0%,55%{transform:translateY(0);opacity:1}100%{transform:translateY(90px) scaleY(1.3);opacity:0}}
/* sport bottle variant */
.bottle.sport .nozzle{display:block}
.bottle.sport .cap{left:85px;top:44px;width:170px;height:62px;border-radius:14px 14px 8px 8px}
.bottle.sport .ring{top:102px}
.bottle.sport .body{border-radius:92px 92px 64px 64px/130px 130px 54px 54px}
.bottle.sport .grip{display:block}
.bottle.sport .label{top:33%}

.sh-pos{position:absolute;left:540px;top:1468px;width:0;height:0;z-index:14}
.shadow{position:absolute;left:-200px;top:-34px;width:400px;height:68px;opacity:0}
.sh-float{width:100%;height:100%;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.34),transparent);animation:sfloat 4.6s ease-in-out infinite alternate}
@keyframes sfloat{from{transform:scale(1)}to{transform:scale(.88);opacity:.75}}

/* ---------- fruit / ice layers: pos (parallax) > anim (WAAPI) > art (CSS bob) ---------- */
.fx{position:absolute;inset:0;pointer-events:none}
#fxBack{z-index:10}#fxFront{z-index:26}
.fx-pos{position:absolute;width:0;height:0}
.fx-anim{position:absolute;width:var(--s);height:var(--s);left:calc(var(--s)/-2);top:calc(var(--s)/-2)}
.fx-art{width:100%;height:100%;animation:bob var(--bd) ease-in-out var(--bdl) infinite alternate}
@keyframes bob{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--bx),var(--by)) rotate(var(--br))}}
.back .fx-art{filter:blur(3px) saturate(.9)}
.f{position:relative;width:100%;height:100%;transform:rotate(var(--r))}
.f::before,.f::after{content:"";position:absolute}
.f-peach{border-radius:50%;background:radial-gradient(circle at 34% 30%,#ffe6bf 0 7%,#ffb27a 30%,#f2685a 72%,#d23f4d)}
.f-peach::before{left:46%;top:8%;width:40%;height:84%;border-left:5px solid rgba(160,40,40,.3);border-radius:50%}
.f-peach::after{left:52%;top:-13%;width:42%;height:24%;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#7bd06f,#2f8f46);transform:rotate(-12deg)}
.f-peachslice{border-radius:50%;background:radial-gradient(circle,#8e3418 0 16%,#d9602f 18% 23%,#ffc873 31%,#ffb24f 68%,#f28a3c 75%,#e0513d 80%)}
.f-peachslice::after,.f-slice::after,.f-cube::after,.f-blue::before{left:18%;top:14%;width:34%;height:22%;border-radius:50%;background:rgba(255,255,255,.35);filter:blur(3px)}
.f-cube{border-radius:22%;background:linear-gradient(145deg,#ffe36e,#ffb321 50%,#ff8800);box-shadow:inset -12px -14px 0 rgba(200,90,0,.3),inset 8px 8px 0 rgba(255,255,255,.35)}
.f-cube::before{inset:18%;border-radius:12%;background:linear-gradient(90deg,transparent 31%,rgba(210,110,0,.35) 31% 35%,transparent 35% 64%,rgba(210,110,0,.35) 64% 68%,transparent 68%),linear-gradient(0deg,transparent 31%,rgba(210,110,0,.35) 31% 35%,transparent 35% 64%,rgba(210,110,0,.35) 64% 68%,transparent 68%)}
.f-leaf{border-radius:0 100% 0 100%;background:linear-gradient(135deg,var(--l1,#49b565),var(--l2,#1d6b43))}
.f-leaf::before{left:50%;top:50%;width:128%;height:4px;background:rgba(255,255,255,.35);transform:translate(-50%,-50%) rotate(45deg)}
.f-mint{--l1:#8ae88f;--l2:#2f9e4b}
.f-tea{--l1:#6d9a3a;--l2:#2c4a14;transform:rotate(var(--r)) scaleX(.62)}
.f-rasp{border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#ff86ad 0 14%,#e0245f 42%,#9c0c3d 68%);background-size:23% 23%}
.f-rasp::after{inset:0;border-radius:50%;background:radial-gradient(circle at 36% 30%,rgba(255,255,255,.3),transparent 40%,rgba(60,0,20,.45) 88%)}
.f-blue{border-radius:50%;background:radial-gradient(circle at 36% 32%,#9aa8f0 0 6%,#4b5bb8 30%,#262b6e 70%,#141838)}
.f-blue::after{left:36%;top:36%;width:28%;height:28%;background:#10132c;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.f-slice{border-radius:50%;
  background:radial-gradient(circle,var(--c3) 0 6%,transparent 6.5%),repeating-conic-gradient(from 8deg,var(--c2) 0 26deg,var(--c3) 26deg 30deg);
  box-shadow:inset 0 0 0 calc(var(--s)*.05) var(--c3),inset 0 0 0 calc(var(--s)*.1) var(--c1),0 10px 24px rgba(0,0,0,.12)}
.f-cherry{border-radius:50%;background:radial-gradient(circle at 34% 30%,#ff8a8a 0 7%,#e0112f 36%,#7a0016)}
.f-cherry::before{left:48%;top:-44%;width:7%;height:52%;border-radius:6px;background:#5b7a2a;transform:rotate(18deg);transform-origin:50% 100%}
.f-bolt{background:linear-gradient(160deg,#6ff7df,var(--acc,#19e3c4) 55%,#0a9c86);clip-path:polygon(42% 0,96% 0,62% 40%,90% 40%,18% 100%,38% 56%,8% 56%)}
.f-drop{border-radius:0 50% 50% 50%;transform:rotate(45deg);background:radial-gradient(circle at 62% 62%,rgba(255,255,255,.98),var(--dropc,rgba(255,255,255,.4)) 62%);box-shadow:0 4px 10px rgba(0,0,0,.1)}
.f-ice{border-radius:20%;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(255,255,255,.28) 45%,rgba(205,238,255,.55));
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),inset -14px -16px 26px rgba(255,255,255,.45),0 24px 40px rgba(0,0,0,.14)}
.f-ice::before{left:14%;top:12%;width:44%;height:12%;border-radius:10px;background:rgba(255,255,255,.9);transform:rotate(-8deg)}
.f-ice::after{right:12%;bottom:14%;width:14%;height:40%;border-radius:10px;background:rgba(255,255,255,.5)}

/* photo layers (Gemini Studio cut-outs in img/) */
.f-img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 16px 18px rgba(0,0,0,.2))}
.back .f-img{filter:none}
.bottle.photo>*:not(.b-img){display:none}
.b-img{position:absolute;left:50%;bottom:0;height:100%;width:auto;transform:translateX(-50%);display:none;pointer-events:none}
.bottle.photo .b-img{display:block}
.bottle.photo{filter:drop-shadow(0 34px 34px rgba(0,0,0,.22))}

/* splash on landing */
#splash{position:absolute;inset:0;z-index:25;pointer-events:none}
.splash{position:absolute;width:0;height:0}
.splash .sring{position:absolute;left:0;top:0;width:380px;height:74px;border-radius:50%;border:6px solid rgba(255,255,255,.85)}
.splash b{position:absolute;left:0;top:0;border-radius:50%;margin:-8px}

/* ---------- info row ---------- */
.info{position:absolute;left:70px;right:70px;top:1642px;display:flex;justify-content:space-between;align-items:flex-end;z-index:30;color:var(--ink)}
.info .left{width:600px}
.tag>span{font-weight:800;font-size:44px;line-height:1.08;letter-spacing:-.01em}
.ar{margin-top:8px}
.ar>span{font-family:Cairo,sans-serif;font-weight:700;font-size:36px;opacity:.85}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
.chips{display:flex;gap:10px}
.chips b{white-space:nowrap;font-weight:800;font-size:21px;letter-spacing:.12em;padding:10px 18px;border:2px solid var(--ink);border-radius:99px;transform:scale(0)}
.cta{display:flex;align-items:center;gap:14px;white-space:nowrap;background:var(--ctaBg);color:var(--ctaInk);padding:22px 30px 22px 34px;border-radius:99px;font-weight:900;font-size:28px;letter-spacing:.06em;transform:scale(0);box-shadow:0 18px 36px rgba(0,0,0,.18)}
.cta .price{opacity:.7}
.cta svg{width:34px;height:34px}
.foot{position:absolute;left:0;right:0;top:1846px;text-align:center;z-index:30;color:var(--ink);font-weight:700;font-size:22px;letter-spacing:.3em;opacity:.55;transition:color .6s}

/* ---------- landscape composition (1920x1080 canvas) ---------- */
.land .head{left:130px;top:215px;width:1000px}
.land .name>span{font-size:170px}
.land .count,.land .foot{display:none}
.land #rays{left:-200px;top:-910px}
.land .word-pos{left:650px;top:240px;width:1100px;height:520px}
.land .rib-pos{left:790px;width:1950px;-webkit-mask:linear-gradient(90deg,transparent,#000 280px);mask:linear-gradient(90deg,transparent,#000 280px)}
.land .rib-pos.back{top:620px;transform:rotate(8deg)}
.land .rib-pos.front{top:792px;transform:rotate(-5deg)}
.land .b-pos{left:1200px;top:165px;scale:.78}
.land .sh-pos{left:1200px;top:842px;scale:.78}
.land .info{left:130px;right:auto;top:668px;width:800px;display:block}
.land .info .left{width:760px}
.land .tag>span{font-size:40px}
.land .ar>span{font-size:34px}
.land .right{align-items:flex-start;margin-top:26px;gap:22px}
.cta-row{display:flex;align-items:center;gap:34px}
.cta2{font-weight:800;font-size:24px;letter-spacing:.08em;color:var(--ink);text-decoration:none;border-bottom:3px solid currentColor;padding-bottom:4px;opacity:0}
.port .cta2{display:none}
a.cta{text-decoration:none}

/* ---------- layer map (L) ---------- */
body.map [data-layer]{outline:3px dashed #00e5ff;outline-offset:-3px}
body.map [data-layer]::after{content:attr(data-layer);position:absolute;left:0;top:0;background:#00e5ff;color:#001;font:800 18px/1 "Inter Tight",sans-serif;padding:5px 8px;white-space:nowrap;z-index:99;filter:none}
body.map .fx-art,body.map .rib{filter:none!important}

/* ---------- ?reel : hands-free 9:16 take for screen recording ----------
   #stage becomes a true 9:16 box centred on black, so the recorded frame is
   the frame -- no letterbox baked in and no dependence on window shape.
   --rw/--rh are that box in px (set by fit), because vw/vh still mean window. */
.dim,.hook,.finger,.endcard{display:none}
body.reel{background:#000}
.reel #stage{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);
  width:min(100vw,56.25vh);height:min(177.778vw,100vh);cursor:none}
.reel .nav,.reel .arrows,.reel .foot{display:none}   /* .foot overlaps .index in portrait */

.reel .dim{display:block;position:absolute;inset:0;z-index:70;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,rgba(4,7,9,.42),rgba(4,7,9,.8));opacity:0;transition:opacity .75s ease}
.reel.hooking .dim,.reel.ending .dim{opacity:1}

.reel .hook{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;
  pointer-events:none;width:86%;text-align:center;color:#fff;
  font-family:Anton,"Inter Tight",sans-serif;font-weight:400;letter-spacing:.005em;line-height:1.04;
  font-size:calc(var(--rh,900px)*.055);text-transform:uppercase;white-space:nowrap;opacity:1;transition:opacity .5s ease}
.reel .hook span{display:block;opacity:0;transform:translateY(38px);filter:blur(12px);
  transition:opacity .75s ease,transform .75s cubic-bezier(.2,.8,.2,1),filter .75s ease}
.reel .hook.show span{opacity:1;transform:none;filter:none}
.reel .hook.show span:nth-child(2){transition-delay:.38s}
.reel .hook.show span:nth-child(3){transition-delay:.76s}
.reel .hook em{font-style:normal;color:transparent;-webkit-text-stroke:calc(var(--rh,900px)*.0026) #fff}

.reel .finger{display:block;position:absolute;left:0;top:0;z-index:78;pointer-events:none;
  width:calc(var(--rh,900px)*.052);height:calc(var(--rh,900px)*.052);margin:calc(var(--rh,900px)*-.026) 0 0 calc(var(--rh,900px)*-.026);
  border-radius:50%;background:rgba(255,255,255,.28);box-shadow:0 0 0 2px rgba(255,255,255,.75),0 8px 26px rgba(0,0,0,.35);
  opacity:0;scale:1;transition:opacity .18s ease,scale .18s ease}
.reel .finger.on{opacity:1}
.reel .finger.press{scale:.72;background:rgba(255,255,255,.5)}

.reel .endcard{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:82;
  pointer-events:none;text-align:center;color:#fff;opacity:0;transition:opacity .2s ease}
.reel.ending .endcard{opacity:1;transition:opacity .7s ease}
.reel .endcard b{display:block;font-family:Anton,sans-serif;font-weight:400;letter-spacing:.06em;
  font-size:calc(var(--rh,900px)*.105);line-height:1}
.reel .endcard span{display:block;margin-top:calc(var(--rh,900px)*.018);font-weight:800;
  font-size:calc(var(--rh,900px)*.019);letter-spacing:.24em;white-space:nowrap;opacity:.82}
.reel .endcard i{display:inline-block;margin-top:calc(var(--rh,900px)*.042);font-style:normal;font-weight:900;
  font-size:calc(var(--rh,900px)*.028);letter-spacing:.1em;border:calc(var(--rh,900px)*.0026) solid rgba(255,255,255,.85);
  border-radius:99px;padding:calc(var(--rh,900px)*.016) calc(var(--rh,900px)*.038)}

body.rec #stage{cursor:none}
</style>
</head>

/* Photo layers. Keys are SLIDES[].word; each fx type cycles through its list in order.
   Types left out (drop, bolt) keep their CSS art. */
const IMG = {
  PEACH:  { bottle: 'bottle-peach',  peach: ['ing-peach-1', 'ing-peach-2'], peachslice: ['ing-peach-3'], mint: ['ing-peach-4'] },
  MANGO:  { bottle: 'bottle-mango',  cube: ['ing-mango-1', 'ing-mango-2', 'ing-mango-4', 'ing-mango-5'], leaf: ['ing-mango-3', 'ing-mango-6'] },
  BERRY:  { bottle: 'bottle-berry',  rasp: ['ing-berry-1', 'ing-berry-3'], blue: ['ing-berry-2'], mint: ['ing-berry-4'] },
  CITRUS: { bottle: 'bottle-citrus', slice: ['ing-citrus-1', 'ing-citrus-2'], mint: ['ing-citrus-3'], tea: ['ing-citrus-4'] },
  SPORT:  { bottle: 'bottle-sport',  slice: ['ing-sport-1', 'ing-sport-2'], cherry: ['ing-sport-3', 'ing-sport-4'] },
  ice: ['ice-1', 'ice-2', 'ice-3', 'ice-4'],
};
const src = name => `img/${name}.webp`;
const preload = name => new Promise(res => { const im = new Image(); im.onload = im.onerror = () => (im.decode ? im.decode().catch(() => {}) : Promise.resolve()).then(res); im.src = src(name); });
const slideImages = s => { const m = IMG[s.word]; return [m.bottle, ...Object.entries(m).filter(([k]) => k !== 'bottle').flatMap(([, v]) => v), ...IMG.ice]; };

const DWELL = 4200;                         // hold time per slide once it has landed

/* Two compositions share every layer. Fruit coordinates in SLIDES are authored
   around the portrait bottle (540,1010) and re-projected around the landscape one. */
const LAYOUT = {
  land: { W: 1920, H: 1080, bx: 1200, btop: 165, sc: .78, sx: 1.2, sy: 1, fs: 1.08, wordW: 1050, wordMax: 470 },
  port: { W: 1080, H: 1920, bx: 540, btop: 600, sc: 1, sx: 1, sy: 1, fs: 1, wordW: 1000, wordMax: 560 },
};
const SRC_CX = 540, SRC_CY = 1010;

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const stage = $('#stage'), canvas = $('#canvas'), bgs = $('#bgs');
/* ?reel forces the 9:16 box, so every viewport measurement below reads the
   stage rather than the window -- they are identical off-reel. */
const REEL = /[?&]reel\b/.test(location.search);
if (REEL) document.body.classList.add('reel');
const VW = () => stage.clientWidth, VH = () => stage.clientHeight;
let idx = -1, busy = false, queued = null, paused = false, rate = 1, prog = null;
let MODE = null, L = LAYOUT.land, S = 1;

/* ---------- helpers ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms * rate));
const clamp = v => Math.max(0, Math.min(1, v));
const eio = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const rnd = (a, b) => a + Math.random() * (b - a);
function A(el, frames, o = {}) {
  const a = el.animate(frames, { duration: o.d || 600, delay: o.delay || 0, easing: o.e || 'cubic-bezier(.2,.8,.2,1)', fill: o.fill || 'both' });
  a.playbackRate = 1 / rate;
  return a;
}
function clearAnims(el) {
  el.getAnimations().forEach(a => { if (!(window.CSSAnimation && a instanceof CSSAnimation)) a.cancel(); });
}
const origin = () => ({ x: L.bx, y: L.btop + 410 * L.sc });   // bottle centre on the canvas
const groundY = () => L.btop + 868 * L.sc;
function toViewport(x, y) {                                     // canvas px -> viewport px
  return { x: (VW() - L.W * S) / 2 + x * S, y: (VH() - L.H * S) / 2 + y * S };
}

/* ---------- responsive fit ---------- */
function fit() {
  const m = REEL ? 'port' : (VW() / VH() >= 1 ? 'land' : 'port');
  const changed = m !== MODE;
  MODE = m; L = LAYOUT[m];
  stage.classList.toggle('land', m === 'land');
  stage.classList.toggle('port', m === 'port');
  S = Math.min(VW() / L.W, VH() / L.H);

});

/* ---------- input ---------- */
function setRate(r) { rate = r; document.getAnimations().forEach(a => a.playbackRate = 1 / r); }
$('#prev').addEventListener('click', () => go(idx - 1));
$('#next').addEventListener('click', () => go(idx + 1));
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(idx + 1);
  else if (e.key === 'ArrowLeft') go(idx - 1);
  else if (e.code === 'Space') { e.preventDefault(); paused = !paused; if (prog) paused ? prog.pause() : prog.play(); }
  else if (e.key === 's' || e.key === 'S') setRate(rate === 1 ? 4 : 1);
  else if (e.key === 'l' || e.key === 'L') document.body.classList.toggle('map');
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('rec');
});
let downX = null;                                   // touch swipe
stage.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') downX = e.clientX; });
stage.addEventListener('pointerup', e => {
  if (downX === null) return;
  const dx = e.clientX - downX; downX = null;
  if (Math.abs(dx) > 50) go(idx + (dx < 0 ? 1 : -1));
});

/* ============================================================
   ?reel AUTOPILOT: a scripted, seamlessly looping 9:16 take.
   go() stays the only thing that changes a slide, so the reel and the live
   site can never drift apart; the finger is cosmetic, it just sells the
   swipe to a viewer who cannot see the timeline driving it.
   The timeline reads performance.now() directly, so slow-mo (S) desyncs it:
   record at rate 1.
   ============================================================ */
const REEL_STEP = 5400;                       // ms of screen time per flavour
const REEL_HOLD = 3000;                       // end card before the loop point (total: exactly 30s)
const hook = $('#hook'), finger = $('#finger');
let T0 = 0, step = 0, gest = null;
const swipe = () => { gest = performance.now(); };

const TIMELINE = [
  [0,    () => { document.body.classList.remove('ending'); document.body.classList.add('hooking'); go(0); }],
  [700,  () => hook.classList.add('show')],
  [3400, () => { document.body.classList.remove('hooking'); hook.classList.remove('show'); }],
];
for (let k = 1; k < SLIDES.length; k++) TIMELINE.push([k * REEL_STEP - 400, swipe], [k * REEL_STEP, () => go(k)]);
const REEL_PERIOD = SLIDES.length * REEL_STEP + REEL_HOLD;
TIMELINE.push([SLIDES.length * REEL_STEP - 400, () => document.body.classList.add('ending')]);
TIMELINE.push([REEL_PERIOD, () => { T0 = performance.now(); step = 0; }]);   // next frame replays from 0

function pilot(now) {
  requestAnimationFrame(pilot);
  if (!T0) T0 = now;
  while (step < TIMELINE.length && now - T0 >= TIMELINE[step][0]) TIMELINE[step++][1]();
  if (gest === null) return;
  const g = now - gest, D = 620;
  if (g >= D + 140) { finger.classList.remove('on', 'press'); gest = null; return; }
  finger.classList.add('on');
  finger.classList.toggle('press', g > 80 && g < D - 60);
  finger.style.transform = `translate(${(VW() * (.74 - .48 * eio(clamp(g / D)))).toFixed(1)}px,${(VH() * .62).toFixed(1)}px)`;
}

/* ---------- boot ---------- */
if (/[?&]rec\b/.test(location.search)) document.body.classList.add('rec');
const start = Math.max(0, Math.min(SLIDES.length - 1, (parseInt((location.hash.match(/#s(\d+)/) || [])[1]) || 1) - 1));
const fontsIn = document.fonts
  ? Promise.all(['400 100px Anton', '700 40px Cairo', '800 40px "Inter Tight"', '900 40px "Inter Tight"'].map(f => document.fonts.load(f, 'AZ مرحبا').catch(() => {})))
  : Promise.resolve();
Promise.race([fontsIn, new Promise(r => setTimeout(r, 2500))]).then(async () => {
  if (REEL) {                                  // a take cannot stutter on a cold image
    const all = [...new Set(SLIDES.flatMap(slideImages))];
    await Promise.race([Promise.all(all.map(preload)), new Promise(r => setTimeout(r, 20000))]);
    requestAnimationFrame(pilot);
    return;
  }
  go(start);
  setTimeout(() => SLIDES.forEach(sl => slideImages(sl).forEach(preload)), 2500);   // warm the rest
});
</script>
</body>
</html>
