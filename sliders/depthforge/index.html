<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEPTHFORGE — Bend the Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07080c;
  --ink:#eef1f6;
  --muted:#8a8f9e;
  --accent:#5EE7DF;
  --accent-soft:rgba(94,231,223,.16);
  --line:rgba(255,255,255,.10);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --disp:"Space Grotesk","Inter",-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;perspective:1500px;perspective-origin:50% 50%;cursor:grab;z-index:1}
#stage.dragging{cursor:grabbing}
#world{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform:rotateX(var(--wx,0deg)) rotateY(var(--wy,0deg));
  will-change:transform;
}
.layer{
  position:absolute;left:50%;top:50%;transform-style:preserve-3d;
  will-change:transform;pointer-events:none;
}

/* ---------- L0 : light field ---------- */
.wash{width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;
  background:
   radial-gradient(45% 40% at 50% 42%, var(--accent-soft), transparent 70%),
   radial-gradient(60% 50% at 18% 78%, rgba(255,255,255,.05), transparent 70%),
   radial-gradient(50% 45% at 85% 20%, rgba(255,255,255,.04), transparent 70%);
  transition:background 1.1s ease;
}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(120% 90% at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply}
.grain{position:fixed;inset:-50%;pointer-events:none;z-index:61;opacity:.15;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
  animation:grain 6s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}

/* ---------- L1 : floor grid ---------- */
.floor{width:2600px;height:2600px;margin:-1300px 0 0 -1300px;opacity:.55}
.floor .plane{position:absolute;inset:0;
  background-image:
    linear-gradient(to right, var(--line) 1px, transparent 1px),
    linear-gradient(to bottom, var(--line) 1px, transparent 1px);
  background-size:110px 110px;
  transform:rotateX(78deg) translateZ(-330px);
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 60%);
  mask-image:radial-gradient(circle at 50% 50%, #000 0%, transparent 60%);
}
.horizon{width:2200px;height:1px;margin:-.5px 0 0 -1100px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.30}

/* ---------- L2 : ghost word ---------- */
.ghost{font-family:var(--disp);font-weight:700;letter-spacing:-.05em;
  font-size:clamp(90px,19vw,290px);line-height:.8;white-space:nowrap;}
.ghost span{display:block;transform:translate(-50%,-50%);
  color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.14)}

/* ---------- L3 : orbit debris ---------- */
.dust b{position:absolute;display:block;border-radius:50%;
  background:var(--accent);box-shadow:0 0 12px var(--accent)}
.shard{position:absolute;border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(135deg,rgba(255,255,255,.07),transparent 60%)}

/* ---------- L4 : the objects ---------- */
.obj{position:absolute;left:0;top:0;transform-style:preserve-3d;
  opacity:0;transition:opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1);
  transform:scale(.7) translateZ(-460px)}
.obj.on{opacity:1;transform:scale(1) translateZ(0)}
.obj > div{position:absolute;transform-style:preserve-3d}

/* gyroscope */
.ring{border-radius:50%;border:1.5px solid var(--accent);
  box-shadow:0 0 26px var(--accent-soft), inset 0 0 26px var(--accent-soft)}
.ring.thin{border-color:rgba(255,255,255,.26);box-shadow:none;border-width:1px}
.core{border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff, var(--accent) 42%, rgba(4,6,10,.95) 100%);
  box-shadow:0 0 60px var(--accent)}

/* plate monolith */
.plate{border:1px solid rgba(255,255,255,.20);
  background:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.012) 55%);
  box-shadow:0 0 30px rgba(0,0,0,.45)}
.plate.acc{border-color:var(--accent);box-shadow:0 0 24px var(--accent-soft)}

/* wire sphere */
.lat{border-radius:50%;border:1px solid rgba(255,255,255,.20)}
.lat.acc{border-color:var(--accent);box-shadow:0 0 18px var(--accent-soft)}

/* prism cube */
.face{border:1px solid var(--accent);
  background:linear-gradient(135deg, var(--accent-soft), rgba(255,255,255,.03) 60%);
  box-shadow:inset 0 0 40px rgba(255,255,255,.05)}
.face .cross{position:absolute;inset:0;
  background:
   linear-gradient(to right, rgba(255,255,255,.09) 1px, transparent 1px) 0 0/25% 100%,
   linear-gradient(to bottom, rgba(255,255,255,.09) 1px, transparent 1px) 0 0/100% 25%;}
.edge{background:var(--accent);box-shadow:0 0 10px var(--accent)}

/* reflected pool under the object */
.puddle{width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:radial-gradient(circle, var(--accent-soft), transparent 62%);
  transform:rotateX(80deg) translateZ(-300px);filter:blur(16px)}

/* ---------- UI ---------- */
.ui{position:fixed;inset:0;z-index:40;pointer-events:none;
  padding:clamp(20px,3.6vw,54px);display:grid;grid-template-rows:auto 1fr auto}
.ui button{pointer-events:auto}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.28em;font-size:13px}
.brand i{font-style:normal;color:var(--accent);transition:color .8s ease}
.nav{display:flex;gap:26px;font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
@media(max-width:820px){.nav{display:none}}

.mid{display:flex;align-items:flex-end}
.caption{max-width:min(560px,50vw)}
@media(max-width:900px){.caption{max-width:none}}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:10.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--accent);margin-bottom:18px;transition:color .8s ease}
.eyebrow s{display:block;width:46px;height:1px;background:var(--accent);opacity:.6}
h1{font-family:var(--disp);font-weight:700;letter-spacing:-.035em;
  font-size:clamp(38px,6.2vw,84px);line-height:.94;margin-bottom:20px}
h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1.2px var(--accent)}
.copy{color:var(--muted);font-size:clamp(14px,1.1vw,17px);line-height:1.65;max-width:46ch}
.cta{margin-top:30px;display:inline-flex;align-items:center;gap:14px;
  padding:14px 26px;border:1px solid var(--line);border-radius:999px;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  transition:.35s cubic-bezier(.2,.7,.2,1)}
.cta:hover{border-color:var(--accent);background:var(--accent-soft);gap:20px}
.cta u{text-decoration:none;color:var(--accent)}

/* staggered reveal */
.rv{opacity:0;transform:translateY(26px);filter:blur(6px)}
.in .rv{opacity:1;transform:none;filter:none;
  transition:opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1), filter .8s ease}
.in .rv:nth-child(1){transition-delay:.06s}
.in .rv:nth-child(2){transition-delay:.14s}
.in .rv:nth-child(3){transition-delay:.22s}
.in .rv:nth-child(4){transition-delay:.30s}
.out .rv{opacity:0;transform:translateY(-18px);filter:blur(6px);
  transition:opacity .4s ease, transform .4s ease, filter .4s ease}

.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
.dots{display:flex;gap:10px;align-items:center}
.dot{width:34px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);
  position:relative;overflow:hidden;transition:.4s;pointer-events:auto;cursor:pointer;
  border:0;padding:0}
.dot.on{background:rgba(255,255,255,.20);width:62px}
.dot.on::after{content:"";position:absolute;inset:0;background:var(--accent);
  transform-origin:left;animation:fill var(--dur,7s) linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.right{display:flex;gap:14px;align-items:center}
.arrow{width:52px;height:52px;border:1px solid var(--line);border-radius:50%;
  display:grid;place-items:center;transition:.35s}
.arrow:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px)}
.arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5}
.counter{font-family:var(--disp);font-size:11px;letter-spacing:.2em;color:var(--muted);margin-right:8px}
.counter b{color:var(--ink);font-size:26px;font-weight:500;vertical-align:-2px}

.hint{position:fixed;left:50%;bottom:clamp(96px,13vh,150px);transform:translateX(-50%);
  z-index:41;display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--muted);pointer-events:none;
  transition:opacity .6s ease;white-space:nowrap}
.hint.gone{opacity:0}
.grip{display:flex;gap:3px}
.grip i{width:2px;height:12px;background:var(--accent);opacity:.35;border-radius:2px;
  animation:grip 1.6s ease-in-out infinite}
.grip i:nth-child(2){animation-delay:.15s}
.grip i:nth-child(3){animation-delay:.3s}
@keyframes grip{0%,100%{opacity:.2;transform:scaleY(.6)}50%{opacity:.9;transform:scaleY(1)}}

.spot{position:fixed;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;
  pointer-events:none;z-index:2;left:0;top:0;
  background:radial-gradient(circle, var(--accent-soft), transparent 65%);
  filter:blur(30px);opacity:.8}

@media(max-width:760px){
  .bottom{flex-direction:column-reverse;align-items:flex-start;gap:18px}
  .hint{bottom:auto;top:calc(50% + 150px)}
  .copy{max-width:34ch}
}
@media (prefers-reduced-motion: reduce){.grain{animation:none}}

/* ---------- portrait: lift the object, give the caption the bottom ---------- */
:root{--cy:50%}
.layer{top:var(--cy)}
#stage{perspective-origin:50% var(--cy)}
@media (orientation:portrait){
  :root{--cy:40%}
  .caption{max-width:none}
  h1{font-size:clamp(34px,10vw,64px)}
  .copy{display:none}
  .cta{margin-top:14px}
  .hint{bottom:auto;top:calc(var(--cy) + 44vmin)}
}

/* ---------- x-ray: every circle collapses into the square <div> it really is ---------- */
.ring,.core,.lat{transition:border-radius .9s cubic-bezier(.7,0,.2,1), box-shadow .6s ease}
.xray .obj div{outline:1px dashed rgba(255,255,255,.34);outline-offset:-1px}
.xray .ring,.xray .core,.xray .lat{border-radius:0}
.xray .core{background:transparent;box-shadow:none}
.xray .face{background:transparent}

/* ---------- ?reel : hands-free 9:16 take for screen recording ---------- */
.hook,.dim,.finger,.endcard{display:none}
.reel .nav,.reel .brand,.reel .cta,.reel .copy,.reel .right,.reel .hint{display:none}
.reel.auto,.reel.auto #stage{cursor:none}
.reel .ui{padding:14vh 20vw 23vh 7vw;transition:opacity .7s ease}
.reel.hooking .ui,.reel.ending .ui{opacity:0}
.reel .eyebrow{margin-bottom:12px}
.reel h1{font-size:clamp(30px,9vw,56px);margin-bottom:16px}
.reel .dim{display:block;position:fixed;inset:0;z-index:30;pointer-events:none;
  background:rgba(4,5,8,.72);opacity:0;transition:opacity .9s ease}
.reel.hooking .dim,.reel.ending .dim{opacity:1}
.reel .hook{display:block;position:fixed;left:50%;top:50%;z-index:45;pointer-events:none;
  transform:translate(-50%,-50%);transform-origin:50% 0;text-align:center;white-space:nowrap;
  font-family:var(--disp);font-weight:700;letter-spacing:-.04em;line-height:.98;
  font-size:clamp(40px,12vw,96px);
  transition:top 1s cubic-bezier(.7,0,.2,1), transform 1s cubic-bezier(.7,0,.2,1), opacity .6s ease}
.reel .hook span{display:block;opacity:0;transform:translateY(30px);filter:blur(8px);
  transition:opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1), filter .5s ease}
.reel .hook.show span{opacity:1;transform:none;filter:none}
.reel .hook.show span:nth-child(2){transition-delay:.45s}
.reel .hook.show span:nth-child(3){transition-delay:.9s}
.reel .hook em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px var(--accent);transition:color .8s ease}
.reel .hook.docked{top:11vh;transform:translate(-50%,0) scale(.36)}
.reel .hook.docked em{color:var(--accent)}
.reel.ending .hook{opacity:0}
.reel .finger{display:block;position:fixed;left:0;top:0;z-index:44;pointer-events:none;
  width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,.5), rgba(255,255,255,.1) 62%, transparent 72%);
  border:1.5px solid rgba(255,255,255,.7);opacity:0;transition:opacity .25s ease, scale .2s ease}
.reel .finger.on{opacity:1}
.reel .finger.press{scale:.8}
.reel .endcard{display:block;position:fixed;left:50%;top:44%;z-index:46;pointer-events:none;
  transform:translate(-50%,-50%);text-align:center;white-space:nowrap;opacity:0;transition:opacity .8s ease}
.reel.ending .endcard{opacity:1}
.endcard b{display:block;font-family:var(--disp);font-weight:700;letter-spacing:-.035em;
  font-size:clamp(34px,10vw,72px);line-height:1}
.endcard b em{font-style:normal;color:transparent;-webkit-text-stroke:1.5px var(--accent)}
.endcard small{display:block;margin-top:18px;font-size:11px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--accent)}
</style>
</head>
<body>

<div id="stage">
  <div id="world">
    <div class="layer wash"    data-d=".10" data-z="-900"></div>
    <div class="layer floor"   data-d=".22" data-z="-600"><div class="plane"></div></div>
    <div class="layer horizon" data-d=".18" data-z="-560"></div>
    <div class="layer ghost"   data-d=".38" data-z="-380"><span id="ghost">ORBIT</span></div>
    <div class="layer puddle"  data-d=".55" data-z="-120"></div>
    <div class="layer dust"    data-d=".62" data-z="0" id="dust"></div>
    <div class="layer"         data-d=".70" data-z="0" id="shards"></div>
    <div class="layer"         data-d="1.0" data-z="0" id="objects"></div>
  </div>
</div>

<div class="spot" id="spot"></div>

<div class="ui">
  <div class="top">
    <div class="brand">DEPTH<i>FORGE</i></div>
    <div class="nav"><span>Studio</span><span>Work</span><span>Materials</span><span>Contact</span></div>
  </div>

  <div class="mid">
    <div class="caption in" id="caption">
      <div class="eyebrow rv"><s></s><span id="eyebrow">Interactive 3D</span></div>
      <h1 class="rv" id="title">Bend the<br><em>Canvas</em></h1>
      <p class="copy rv" id="copy">Grab the object and spin it.</p>
      <button class="cta rv"><span id="ctaLabel">Explore the build</span><u>&#8599;</u></button>
    </div>
  </div>

  <div class="bottom">
    <div class="dots" id="dots"></div>
    <div class="right">
      <div class="counter"><b id="idx">01</b> / <span id="total">04</span></div>
      <button class="arrow" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="arrow" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</div>

<div class="hint" id="hint"><span class="grip"><i></i><i></i><i></i></span> Drag to orbit &nbsp;·&nbsp; move to shift depth</div>
<div class="vignette"></div>
<div class="grain"></div>
<div class="dim"></div>
<div class="hook" id="hook"><span>No WebGL.</span><span>No images.</span><span>Just <em>&lt;div&gt;s.</em></span></div>
<div class="finger" id="finger"></div>
<div class="endcard"><b>Now you<br><em>spin it.</em></b><small>Live demo &middot; link in bio</small></div>

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var el = function(t,c){ var n=document.createElement(t); if(c) n.className=c; return n; };
var R = document.documentElement, B = document.body;
var Q = new URLSearchParams(location.search);
var REEL = Q.has("reel"), AUTO = REEL && Q.get("reel") !== "manual";
if(REEL) B.classList.add("reel");
if(AUTO) B.classList.add("auto");

/* ------------------------------------------------------------------ *
 * SLIDES
 * ------------------------------------------------------------------ */
var SLIDES = [
  { key:"gyro",  accent:"#5EE7DF", ghost:"ORBIT",
    eyebrow:"Interactive 3D", title:"Bend the<br><em>Canvas</em>",
    copy:"Grab the object and spin it. The whole scene answers — grid, glow and debris each drift on their own depth plane.",
    cta:"Explore the build" },
  { key:"stack", accent:"#FF8A5B", ghost:"STRATA",
    eyebrow:"Material Depth", title:"Layers you<br><em>can feel</em>",
    copy:"Fifteen plates, one twist. Light rakes across every edge as the tower turns, so the form stays solid from any angle.",
    cta:"Open material library" },
  { key:"globe", accent:"#A78BFA", ghost:"AZIMUTH",
    eyebrow:"Full Rotation", title:"Every angle,<br><em>on demand</em>",
    copy:"A wireframe body built from real geometry — latitudes, meridians and a lit core. Push it past the pole and it keeps its bearing.",
    cta:"View the rotation" },
  { key:"prism", accent:"#B6F09C", ghost:"FORGE",
    eyebrow:"Forged Geometry", title:"Sell the<br><em>moment</em>",
    copy:"A glass monolith suspended in a lightfield. Nothing here is a photograph — every pixel is generated, so it scales forever.",
    cta:"Start a project" },
];

/* ------------------------------------------------------------------ *
 * 3D OBJECTS — pure CSS geometry, zero image assets
 * ------------------------------------------------------------------ */
var objRoot = $("#objects");
var objs = {};

function mk(cls, w, h, t){
  var n = el("div", cls);
  n.style.position = "absolute";
  n.style.width  = w+"px";
  n.style.height = h+"px";
  n.style.left   = (-w/2)+"px";
  n.style.top    = (-h/2)+"px";
  if(t) n.style.transform = t;
  return n;
}
function shell(k){
  var o = el("div","obj"); o.dataset.k = k;
  var spin = el("div");
  spin.style.transformStyle = "preserve-3d";
  spin.style.position = "absolute";
  o.appendChild(spin);
  o._spin = spin;
  return o;
}

/* 1 — gyroscope: orthogonal rings, lit core, orbiting nodes */
function buildGyro(){
  var o = shell("gyro"), s = o._spin;
  [[300,"ring","rotateY(0deg)"],
   [300,"ring thin","rotateY(90deg)"],
   [300,"ring thin","rotateX(90deg)"],
   [232,"ring thin","rotateY(45deg) rotateX(20deg)"],
   [232,"ring","rotateY(-45deg) rotateX(-20deg)"],
   [160,"ring thin","rotateX(60deg) rotateY(30deg)"]
  ].forEach(function(d){ s.appendChild(mk(d[1], d[0]*2, d[0]*2, d[2])); });
  s.appendChild(mk("core", 74, 74));
  for(var i=0;i<7;i++){
    var arm = el("div");
    arm.style.position="absolute"; arm.style.transformStyle="preserve-3d";
    arm.style.left="0"; arm.style.top="0";
    arm.style.transform = "rotateY("+(i*51.4)+"deg) rotateX("+((i%3)*24-24)+"deg) translateZ("+(292+(i%2)*26)+"px)";
    var b = mk("core", 12, 12);
    b.style.boxShadow = "0 0 22px var(--accent)";
    arm.appendChild(b); s.appendChild(arm);
  }
  return o;
}

/* 2 — twisted plate monolith */
function buildStack(){
  var o = shell("stack"), s = o._spin, N = 15;
  for(var i=0;i<N;i++){
    var t = i/(N-1);
    var w = 360 - Math.abs(t-0.45)*270;
    var h = w*0.62;
    var p = mk(i%4===0 ? "plate acc" : "plate", w, h,
      "rotateX(90deg) translateZ("+((i-(N-1)/2)*26)+"px) rotateZ("+(i*7.5)+"deg)");
    s.appendChild(p);
  }
  for(var j=0;j<4;j++){
    var sp = mk("edge", 2, 400, "rotateY("+(j*90)+"deg) translateZ(150px)");
    sp.style.opacity = ".55";
    s.appendChild(sp);
  }
  return o;
}

/* 3 — wireframe sphere */
function buildGlobe(){
  var o = shell("globe"), s = o._spin, Rr = 268, LAT = 13, i;
  for(i=1;i<LAT;i++){
    var a = (i/LAT)*Math.PI;
    var r = Math.sin(a)*Rr, z = Math.cos(a)*Rr;
    s.appendChild(mk(i===Math.round(LAT/2) ? "lat acc" : "lat", r*2, r*2,
      "rotateX(90deg) translateZ("+z+"px)"));
  }
  for(i=0;i<9;i++){
    var m = mk("lat", Rr*2, Rr*2, "rotateY("+(i*20)+"deg)");
    m.style.opacity = ".5";
    s.appendChild(m);
  }
  s.appendChild(mk("core", 96, 96));
  return o;
}

/* 4 — glass prism cube with glowing edges + halo frames */
function buildPrism(){
  var o = shell("prism"), s = o._spin, SZ = 250, H = SZ/2, i;
  ["translateZ("+H+"px)", "rotateY(180deg) translateZ("+H+"px)",
   "rotateY(90deg) translateZ("+H+"px)", "rotateY(-90deg) translateZ("+H+"px)",
   "rotateX(90deg) translateZ("+H+"px)", "rotateX(-90deg) translateZ("+H+"px)"
  ].forEach(function(t){
    var f = mk("face", SZ, SZ, t);
    f.appendChild(el("div","cross"));
    s.appendChild(f);
  });
  for(i=0;i<4;i++)
    s.appendChild(mk("edge", 2, SZ, "rotateY("+(i*90)+"deg) translateZ("+H+"px) translateX("+H+"px)"));
  [-1,1].forEach(function(sg){
    for(var k=0;k<4;k++)
      s.appendChild(mk("edge", SZ, 2,
        "translateY("+(sg*H)+"px) rotateX(90deg) rotateY("+(k*90)+"deg) translateZ("+H+"px)"));
  });
  [[1.9,0],[1.9,90]].forEach(function(d){
    var n = mk("ring thin", SZ*d[0], SZ*d[0], "rotateY("+d[1]+"deg) rotateX(70deg)");
    n.style.opacity = ".45";
    s.appendChild(n);
  });
  return o;
}

var BUILD = { gyro:buildGyro, stack:buildStack, globe:buildGlobe, prism:buildPrism };
SLIDES.forEach(function(sl){ objs[sl.key] = BUILD[sl.key](); objRoot.appendChild(objs[sl.key]); });

/* ------------------------------------------------------------------ *
 * DEBRIS — real 3D positions, so perspective gives true parallax
 * ------------------------------------------------------------------ */
var dust = $("#dust"), DUST = [], i;
for(i=0;i<70;i++){
  var b = el("b");
  var sz = 1 + Math.random()*3.2;
  b.style.width = b.style.height = sz+"px";
  b.style.opacity = (0.18 + Math.random()*0.5).toFixed(2);
  b._p = { x:(Math.random()-.5)*1900, y:(Math.random()-.5)*1100, z:(Math.random()-.5)*1500,
           ph:Math.random()*6.28, sp:.2+Math.random()*.8 };
  dust.appendChild(b); DUST.push(b);
}
var shardWrap = $("#shards"), SHARDS = [];
for(i=0;i<11;i++){
  var sh = el("div","shard");
  var w = 60+Math.random()*190, h = 40+Math.random()*130;
  sh.style.width = w+"px"; sh.style.height = h+"px";
  sh.style.borderRadius = Math.random()>.6 ? "50%" : (Math.random()>.5 ? "3px" : "0");
  sh._p = { x:(Math.random()-.5)*1500, y:(Math.random()-.5)*820, z:(Math.random()-.5)*900,
            ry:Math.random()*360, rx:Math.random()*360, ph:Math.random()*6.28, sp:.15+Math.random()*.5 };
  shardWrap.appendChild(sh); SHARDS.push(sh);
}

/* ------------------------------------------------------------------ *
 * MOTION STATE
 * ------------------------------------------------------------------ */
var S = {
  px:0, py:0, cx:0, cy:0,
  rotY:-22, rotX:12, velY:0.12, velX:0,
  panX:0, panY:0, tPanX:0, tPanY:0,
  drag:false, lx:0, ly:0, t:0, k:1
};

var stage = $("#stage"), spot = $("#spot"), hint = $("#hint");
var layers = [].slice.call(document.querySelectorAll(".layer"))
  .filter(function(n){ return n !== objRoot; })
  .map(function(n){ return { n:n, d:parseFloat(n.dataset.d||"0"), z:parseFloat(n.dataset.z||"0") }; });

stage.addEventListener("pointermove", function(e){
  S.px = (e.clientX / innerWidth) * 2 - 1;
  S.py = (e.clientY / innerHeight) * 2 - 1;
  spot.style.transform = "translate("+e.clientX+"px,"+e.clientY+"px)";
  if(S.drag){
    var dx = e.clientX - S.lx, dy = e.clientY - S.ly;
    S.lx = e.clientX; S.ly = e.clientY;
    dragBy(dx, dy);
    hint.classList.add("gone");
    pauseAuto();
  }
});
function dragBy(dx, dy){
  S.velY += dx * 0.055;
  S.velX -= dy * 0.045;
  S.rotY += dx * 0.28;
  S.rotX -= dy * 0.22;
  S.tPanX = Math.max(-260, Math.min(260, S.tPanX + dx * 0.55));
  S.tPanY = Math.max(-170, Math.min(170, S.tPanY + dy * 0.55));
}
stage.addEventListener("pointerdown", function(e){
  S.drag = true; S.lx = e.clientX; S.ly = e.clientY;
  stage.classList.add("dragging");
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
function endDrag(){ if(!S.drag) return; S.drag = false; stage.classList.remove("dragging"); resumeAuto(); }
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("pointerleave", function(){ if(!S.drag){ S.px = 0; S.py = 0; } });
addEventListener("wheel", function(e){
  if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  S.velY += e.deltaY * 0.012;
  pauseAuto(); resumeAuto();
}, {passive:true});

/* ------------------------------------------------------------------ *
 * RENDER LOOP
 * ------------------------------------------------------------------ */
function frame(){
  S.t += 0.016;
  if(AUTO) pilot();

  S.cx += (S.px - S.cx) * 0.07;
  S.cy += (S.py - S.cy) * 0.07;

  if(!S.drag){ S.tPanX *= 0.94; S.tPanY *= 0.94; }
  S.panX += (S.tPanX - S.panX) * 0.10;
  S.panY += (S.tPanY - S.panY) * 0.10;

  /* whole world tilts with the cursor and with the drag push */
  R.style.setProperty("--wy", (S.cx * 9 + S.panX * 0.018).toFixed(3)+"deg");
  R.style.setProperty("--wx", (-S.cy * 6 - S.panY * 0.016).toFixed(3)+"deg");

  /* every background plane slides by its own depth factor */
  for(var i=0;i<layers.length;i++){
    var L = layers[i];
    var px = (-S.cx * 90 + S.panX) * L.d;
    var py = (-S.cy * 60 + S.panY) * L.d;
    L.n.style.transform = "translate3d("+px.toFixed(1)+"px,"+py.toFixed(1)+"px,"+L.z+"px)";
  }

  /* object rotation + inertia */
  if(!S.drag){
    S.rotY += S.velY;
    S.rotX += S.velX;
    S.velY += (auto || AUTO) ? (0.12 - S.velY) * (AUTO ? 0.035 : 0.02) : -S.velY * 0.035;
    S.velX *= 0.93;
    var clamped = Math.max(-40, Math.min(40, S.rotX));
    S.rotX += (clamped - S.rotX) * 0.05;
  }
  var breathe = Math.sin(S.t * 0.9) * 10;
  objRoot.style.transform =
    "translate3d("+(-S.cx*26 + S.panX*0.35).toFixed(1)+"px,"+
    (breathe - S.cy*18 + S.panY*0.35).toFixed(1)+"px,0px) scale("+S.k+")";

  var rot = "rotateX("+S.rotX.toFixed(2)+"deg) rotateY("+S.rotY.toFixed(2)+"deg)";
  for(var k in objs) objs[k]._spin.style.transform = rot;

  for(var d=0; d<DUST.length; d++){
    var p = DUST[d]._p;
    DUST[d].style.transform = "translate3d("+
      (p.x + Math.sin(S.t*p.sp + p.ph)*22).toFixed(1)+"px,"+
      (p.y + Math.cos(S.t*p.sp*0.8 + p.ph)*16).toFixed(1)+"px,"+p.z+"px)";
  }
  for(var q=0; q<SHARDS.length; q++){
    var sp2 = SHARDS[q]._p;
    SHARDS[q].style.transform = "translate3d("+
      (sp2.x + Math.sin(S.t*sp2.sp + sp2.ph)*30).toFixed(1)+"px,"+
      (sp2.y + Math.cos(S.t*sp2.sp + sp2.ph)*24).toFixed(1)+"px,"+sp2.z+"px) "+
      "rotateY("+(sp2.ry + S.t*sp2.sp*8).toFixed(1)+"deg) rotateX("+(sp2.rx + S.t*sp2.sp*5).toFixed(1)+"deg)";
  }

  requestAnimationFrame(frame);
}

/* ------------------------------------------------------------------ *
 * SLIDER
 * ------------------------------------------------------------------ */
var DUR = AUTO ? 5000 : 7600, cur = -1, auto = !AUTO, timer = null, resumeT = null;
var dots = $("#dots");
SLIDES.forEach(function(s, i){
  var d = el("button","dot");
  d.style.setProperty("--dur", DUR+"ms");
  d.setAttribute("aria-label", "Slide "+(i+1));
  d.addEventListener("click", function(){ go(i, i > cur ? 1 : -1); });
  dots.appendChild(d);
});
$("#total").textContent = String(SLIDES.length).padStart(2,"0");

function hexA(hex, a){
  var h = hex.replace("#","");
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n = parseInt(h,16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}

function go(i, dir){
  i = (i + SLIDES.length) % SLIDES.length;
  if(i === cur) return;
  var s = SLIDES[i], cap = $("#caption");

  cap.classList.remove("in"); cap.classList.add("out");
  if(cur >= 0) objs[SLIDES[cur].key].classList.remove("on");
  S.velY += (dir === -1 ? -3.4 : 3.4);   /* the new object arrives spinning */

  setTimeout(function(){
    R.style.setProperty("--accent", s.accent);
    R.style.setProperty("--accent-soft", hexA(s.accent, .16));
    $("#eyebrow").textContent = s.eyebrow;
    $("#title").innerHTML = s.title;
    $("#copy").textContent = s.copy;
    $("#ctaLabel").textContent = s.cta;
    $("#ghost").textContent = s.ghost;
    $("#idx").textContent = String(i+1).padStart(2,"0");
    B.classList.remove("xray");
    objs[s.key].classList.add("on");
    cap.classList.remove("out"); cap.classList.add("in");
    var kids = dots.children;
    for(var j=0;j<kids.length;j++){
      kids[j].classList.remove("on");
      if(j === i){ void kids[j].offsetWidth; kids[j].classList.add("on"); }
    }
    cur = i;
    restart();
  }, 420);
}
function restart(){ clearTimeout(timer); if(auto) timer = setTimeout(function(){ go(cur+1, 1); }, DUR); }
function pauseAuto(){
  auto = false; clearTimeout(timer);
  var kids = dots.children;
  for(var j=0;j<kids.length;j++) kids[j].style.animationPlayState = "paused";
}
function resumeAuto(){
  if(AUTO) return;
  clearTimeout(resumeT);
  resumeT = setTimeout(function(){ auto = true; restart(); }, 4200);
}

$("#next").addEventListener("click", function(){ go(cur+1, 1); });
$("#prev").addEventListener("click", function(){ go(cur-1, -1); });
addEventListener("keydown", function(e){
  if(e.key === "ArrowRight") go(cur+1, 1);
  if(e.key === "ArrowLeft")  go(cur-1, -1);
  if(e.key === "x" || e.key === "X") xray(!B.classList.contains("xray"));
});

/* swipe pages the slider only from the screen edges, so a drag on the
   centre object always orbits instead of jumping slides */
var sx=0, sy=0, st=0, edge=false;
stage.addEventListener("pointerdown", function(e){
  sx = e.clientX; sy = e.clientY; st = Date.now();
  edge = (e.clientX < innerWidth*0.18 || e.clientX > innerWidth*0.82);
});
stage.addEventListener("pointerup", function(e){
  var dx = e.clientX - sx, dy = e.clientY - sy, dt = Date.now() - st;
  if(edge && Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy)*1.6 && dt < 700)
    go(cur + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
});

/* responsive: scale the object cluster to the viewport */
function fit(){
  S.k = innerHeight > innerWidth
    ? Math.min(1, Math.max(.34, innerWidth/820))
    : Math.min(1, Math.max(.42, Math.min(innerWidth/1500, innerHeight/900)));
  if(REEL) S.k *= .92;
}
addEventListener("resize", fit);
fit();

/* ------------------------------------------------------------------ *
 * X-RAY — press X: strip the skin, show the plain elements underneath
 * ------------------------------------------------------------------ */
function xray(on){
  if(cur < 0 || on === B.classList.contains("xray")) return;
  var cap = $("#caption"), s = SLIDES[cur];
  cap.classList.remove("in"); cap.classList.add("out");
  setTimeout(function(){
    B.classList.toggle("xray", on);
    if(on){
      var n = objs[s.key].querySelectorAll("div").length + 1;
      $("#eyebrow").textContent = "X-ray \u00b7 no WebGL";
      $("#title").innerHTML = "Just "+n+"<br><em>&lt;div&gt;s</em>";
      $("#copy").textContent = "Every ring, plate and edge is a plain element placed with CSS 3D transforms. Press X to put the skin back.";
    } else {
      $("#eyebrow").textContent = s.eyebrow;
      $("#title").innerHTML = s.title;
      $("#copy").textContent = s.copy;
    }
    cap.classList.remove("out"); cap.classList.add("in");
  }, 420);
}

/* ------------------------------------------------------------------ *
 * REEL AUTOPILOT — ?reel plays a scripted ~28s take, then loops.
 * A visible "finger" performs the drags so viewers see it's interactive.
 * ------------------------------------------------------------------ */
var finger = $("#finger"), hook = $("#hook"), T0 = 0, step = 0, G = null;
var TIMELINE = [
  /* end card clears under the dim before the hook starts, so the loop never overlaps text */
  [0,     function(){ B.classList.remove("ending"); B.classList.add("hooking"); if(cur > 0) go(0, 1); }],
  [800,   function(){ hook.classList.add("show"); }],
  [3500,  function(){ B.classList.remove("hooking"); hook.classList.add("docked"); }],
  [4600,  function(){ flick(1, 0); }],
  [8200,  function(){ go(1, 1); }],
  [9800,  function(){ flick(-1, .35); }],
  [13200, function(){ go(2, 1); }],
  [14800, function(){ xray(true); }],
  [16000, function(){ flick(1, -.2); }],
  [18200, function(){ xray(false); }],
  [19400, function(){ go(3, 1); }],
  [21000, function(){ flick(1, .25); }],
  [24200, function(){ B.classList.add("ending"); }],
  [27800, function(){ hook.classList.remove("show", "docked"); T0 = performance.now() + 200; step = 0; }]
];

function flick(dir, tilt){
  var cx = innerWidth / 2, cy = innerHeight * (innerHeight > innerWidth ? .40 : .50);
  G = { t0:performance.now(), x0:cx - dir*innerWidth*.22, y0:cy + innerHeight*.06,
        dx:dir*innerWidth*.44, dy:-tilt*innerHeight*.18, lx:0, ly:0 };
}

function pilot(){
  var now = performance.now();
  if(!T0) T0 = now;
  while(step < TIMELINE.length && now - T0 >= TIMELINE[step][0]){
    var fn = TIMELINE[step][1]; step++; fn();
  }
  var x, y;
  if(G){
    var g = now - G.t0;
    if(g < 260){
      x = G.x0; y = G.y0; finger.classList.add("on");
    } else if(g < 1060){
      var p = (g - 260) / 800, e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
      x = G.x0 + G.dx*e; y = G.y0 + G.dy*e;
      if(!S.drag){ S.drag = true; G.lx = x; G.ly = y; finger.classList.add("press"); }
      dragBy(x - G.lx, y - G.ly);
      G.lx = x; G.ly = y;
    } else {
      x = G.x0 + G.dx; y = G.y0 + G.dy;
      if(S.drag){ S.drag = false; finger.classList.remove("press", "on"); }
      if(g > 1400) G = null;
    }
    finger.style.transform = "translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px)";
    S.px = x / innerWidth * 2 - 1;
    S.py = y / innerHeight * 2 - 1;
  } else {
    var t = (now - T0) / 1000;
    S.px = Math.sin(t * .55) * .5;
    S.py = Math.sin(t * .41 + 1.3) * .35;
    x = (S.px + 1) / 2 * innerWidth; y = (S.py + 1) / 2 * innerHeight;
  }
  spot.style.transform = "translate("+x.toFixed(1)+"px,"+y.toFixed(1)+"px)";
}

go(0, 1);
setTimeout(function(){ hint.classList.add("gone"); }, 9000);
frame();
})();
</script>
</body>
</html>
